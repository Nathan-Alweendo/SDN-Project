<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEMMate Namibia - Technical Prototype MVP</title>
    <style>
        :root {
            --primary: #005a9c;
            --warning: #d9381e;
            --success: #1b7a43;
            --bg: #f4f6f8;
            --text: #1a1a1a;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 20px;
            margin: 0;
        }
        main { max-width: 650px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .badge { display: inline-block; padding: 6px 12px; font-weight: bold; border-radius: 4px; margin-bottom: 15px; }
        .badge-offline { background: #e0e0e0; color: #424242; border: 2px solid #757575; }
        .badge-success { background: #d4edda; color: var(--success); border: 2px solid var(--success); }
        .badge-error { background: #f8d7da; color: var(--warning); border: 2px solid var(--warning); }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        input[type="text"], input[type="date"], textarea { width: 100%; padding: 10px; border: 2px solid #767676; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .counter-group { display: flex; align-items: center; gap: 15px; }
        .counter-btn { width: 44px; height: 44px; font-size: 20px; font-weight: bold; cursor: pointer; border: 2px solid var(--primary); background: white; color: var(--primary); border-radius: 4px; }
        .counter-btn:focus, input:focus, textarea:focus { outline: 3px solid #ffbf47; outline-offset: 2px; }
        .counter-val { font-size: 20px; font-weight: bold; width: 40px; text-align: center; }
        .btn-submit { background-color: var(--primary); color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; }
        .btn-submit:hover { background-color: #004070; }
        .alert-box { background: #fff3cd; color: #856404; border: 2px solid #ffeeba; padding: 15px; border-radius: 4px; margin-top: 20px; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    </style>
</head>
<body>

<main role="main">
    <h1>STEMMate Namibia Plan Builder</h1>
    
    <!-- SYSTEM STATUS INDICATOR (QR-03 Non-colour cues / Accessible states) -->
    <div id="statusIndicator" class="badge badge-offline" role="status" aria-live="polite">
        ⬘ Status: Saved Locally (Device Offline)
    </div>

    <!-- WORKFLOW 1: PLAN CREATION (FR-03) -->
    <form id="plannerForm" onsubmit="handleSave(event)">
        <div class="form-group">
            <label for="planDate">Intended Kit Date:</label>
            <input type="date" id="planDate" required value="2026-10-04">
        </div>

        <div class="form-group">
            <label for="safetyNotes">Safety Notes & Inclusion Prompts:</label>
            <textarea id="safetyNotes" rows="3" required placeholder="E.g., Ensure clear pathways for mobility devices. Secure loose battery elements.">Ensure clear pathways for mobility devices.</textarea>
        </div>

        <!-- WORKFLOW 2: PRIVACY-SAFE DEMOGRAPHICS (FR-06) -->
        <fieldset class="form-group">
            <legend style="font-weight: bold; margin-bottom: 10px;">Session Participation Headcounts (No PII)</legend>
            <div class="counter-group">
                <label id="lblGirls" for="valGirls">Girls Count:</label>
                <button type="button" class="counter-btn" onclick="adjustCount('Girls', -1)" aria-label="Decrease girls count">-</button>
                <input type="text" id="valGirls" class="counter-val" value="0" readonly aria-labelledby="lblGirls">
                <button type="button" class="counter-btn" onclick="adjustCount('Girls', 1)" aria-label="Increase girls count">+</button>
            </div>
        </fieldset>

        <button type="submit" class="btn-submit">Atomically Save Plan Session</button>
    </form>

    <!-- WORKFLOW 3: FAILURE / CONFLICT SIMULATION TRIGGER (FR-05, QR-05) -->
    <div id="simulationConsole" style="margin-top: 30px; border-top: 2px dashed #ccc; padding-top: 20px;">
        <h2>Simulate Connectivity & Sync Pipeline</h2>
        <p style="font-size: 14px; color: #555;">Trigger background network synchronization simulation routines:</p>
        <div style="display: flex; gap: 10px;">
            <button type="button" onclick="simulateSync('clean')" style="background:#28a745; color:white; border:none; padding:10px; cursor:pointer; flex:1; border-radius:4px; font-weight:bold;">Simulate Successful Sync</button>
            <button type="button" onclick="simulateSync('conflict')" style="background:#dc3545; color:white; border:none; padding:10px; cursor:pointer; flex:1; border-radius:4px; font-weight:bold;">Simulate Kit Lock Conflict</button>
        </div>
        
        <div id="syncFeedback" class="alert-box" style="display: none;" role="alert"></div>
    </div>
</main>

<script>
    // Local In-Memory & Storage Atomic Mock Representation (QR-01 / SR-01 payload tracking)
    function adjustCount(field, delta) {
        const input = document.getElementById(`valGirls`);
        let current = parseInt(input.value, 10);
        current = Math.max(0, current + delta);
        input.value = current;
    }

    // Workflow 1 & QR-01: Proving Local Atomicity via Storage API
    function handleSave(e) {
        e.preventDefault();
        const dataPayload = {
            date: document.getElementById('planDate').value,
            safety: document.getElementById('safetyNotes').value,
            girlsCount: document.getElementById('valGirls').value,
            syncStatus: "pending"
        };
        
        // Enforce atomic overwrite transaction footprint
        localStorage.setItem('stemmate_active_plan', JSON.stringify(dataPayload));
        
        alert("Transaction Succeeded: Data securely committed to device isolated local storage. Total payload size: ~0.12 KB (Passes SR-01 target constraint).");
    }

    // Workflow 3 & FR-05: Simulation pipeline engine transitions
    function simulateSync(scenario) {
        const feedback = document.getElementById('syncFeedback');
        const status = document.getElementById('statusIndicator');
        feedback.style.display = "block";

        if (scenario === 'clean') {
            status.className = "badge badge-success";
            status.innerHTML = "⬤ Status: Synced Successfully ✓";
            feedback.innerHTML = "<strong>Sync Operation Complete:</strong> Cryptographic handshake verified device authorization credentials. Data processed cleanly via safe idempotent architecture endpoint.";
            feedback.style.borderColor = "var(--success)";
            feedback.style.color = "var(--success)";
            feedback.style.background = "#d4edda";
        } else if (scenario === 'conflict') {
            status.className = "badge badge-error";
            status.innerHTML = "▲ Status: Collision Conflict Detected";
            feedback.innerHTML = "<strong>CRITICAL COLLISION ERROR [FR-05]:</strong> Shared distribution allocation failure. Shared Equipment Kit A is already reserved by operator profile 'Facilitator John' on 04 Oct. Please adjust your deployment timeline.";
            feedback.style.borderColor = "var(--warning)";
            feedback.style.color = "var(--warning)";
            feedback.style.background = "#f8d7da";
        }
    }
</script>
</body>
</html>
